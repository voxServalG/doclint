name: Docs Lint

on:
  push:
    paths:
      - "docs/**"
      - "AGENTS.md"
      - "README.md"
  pull_request:
    paths:
      - "docs/**"
      - "AGENTS.md"
      - "README.md"
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  lint:
    name: Docs Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install doclint
        run: npm install -g github:voxServalG/doclint

      - name: Run lint
        id: lint
        run: |
          doclint lint --json > report.json || true
          if [ $(jq '.failed' report.json) -gt 0 ]; then
            echo "has_errors=true" >> $GITHUB_OUTPUT
          else
            echo "has_errors=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-lint-report
          path: report.json

      - name: Comment on PR
        if: github.event_name == 'pull_request' && steps.lint.outputs.has_errors == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('report.json', 'utf8'));

            let body = `# Docs Lint Report\n\n`;
            body += `Total: ${report.total} | Passed: ${report.passed} | Failed: ${report.failed}\n\n`;

            for (const result of report.results) {
              if (result.issues.length === 0) continue;
              body += `## ${result.file}\n`;
              body += `Lines: ${result.lineCount} | Last modified: ${result.lastModified}\n\n`;
              for (const issue of result.issues) {
                const icon = issue.severity === "error" ? "❌" : "⚠️";
                body += `- ${icon} [${issue.rule}] ${issue.message}\n`;
              }
              body += "\n";
            }

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body.substring(0, 65536)
            });

      - name: Fail if lint errors
        if: steps.lint.outputs.has_errors == 'true'
        run: exit 1

  garden:
    name: Doc-gardening
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install doclint
        run: npm install -g github:voxServalG/doclint

      - name: Run garden
        run: doclint garden

      - name: Create Pull Request
        if: success()
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: auto-fix quality issues"
          title: "docs: auto-fix quality issues"
          body: |
            Automated doc-gardening PR.

            Generated by doclint garden.
          branch: docs/auto-fix
          delete-branch: true
